name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: planterm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep external runner/toolchain noise out of acceptance evidence: checkout's
# default-branch hint and the setup-node action's known punycode deprecation
# are unrelated to PlanTerm application behavior.
env:
  GIT_CONFIG_COUNT: "2"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.defaultBranchName
  GIT_CONFIG_VALUE_1: "false"
  NODE_OPTIONS: --no-deprecation

jobs:
  python:
    name: Python package and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/build_miniso_case.py --check
      - run: git diff --check

  frontend:
    name: Frontend lint, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test:i18n
        working-directory: web
      - run: npx tsc -p tsconfig.node.json --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m uvicorn src.api:app --host 127.0.0.1 --port 8000 > /tmp/planterm-ci.log 2>&1 & echo $! > /tmp/planterm-ci.pid
      - run: python -c "exec('import time, urllib.request\ndeadline=time.time()+30\nwhile time.time() < deadline:\n    try:\n        urllib.request.urlopen(\'http://127.0.0.1:8000/ready\', timeout=2)\n        break\n    except Exception:\n        time.sleep(1)\nelse:\n    raise TimeoutError(\'readiness timeout\')')"
      - run: python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/').status == 200"
      - run: kill $(cat /tmp/planterm-ci.pid)
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e:preflight
        working-directory: web

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
