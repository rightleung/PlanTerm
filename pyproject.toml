[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planterm"
version = "1.2.0"
description = "FP&A Planning and Performance Management Workbench"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "rightleung"}]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "yfinance==0.2.66",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
public-data-yfinance = ["yfinance==0.2.66"]
public-data-akshare = ["akshare>=1,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["planterm*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
